<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de repas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#c9741f">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script>
/* Carnet de repas — version autonome.
   Remplace les capacités Claude (base de données, photos, téléchargements) par un dépôt GitHub privé.
   Les données vivent dans data/<collection>/<id>.json, les photos dans photos/<id>.jpg. */
(function(){
  const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
  const fromHash = () => { const p = new URLSearchParams(location.hash.slice(1)); const k = p.get("k"), r = p.get("r"); if (k && r){ LS.set("gh_token", k); LS.set("gh_repo", r); } };
  fromHash();
  const CFG = { token: LS.get("gh_token"), repo: LS.get("gh_repo") };
  const API = "https://api.github.com";
  const COLS = ["recettes", "semaines", "aliments", "suppressions"];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  async function gh(path, opts = {}){
    const headers = { Authorization: "Bearer " + CFG.token, Accept: opts.accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    if (opts.body) headers["Content-Type"] = "application/json";
    const r = await fetch(API + path, { method: opts.method || "GET", headers, body: opts.body, cache: "no-store" });
    if (!r.ok){ const e = new Error("GitHub " + r.status); e.status = r.status; try { e.body = await r.json(); } catch(_){} throw e; }
    if (opts.raw) return r;
    return r.status === 204 ? null : r.json();
  }
  const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, "")), c => c.charCodeAt(0)));
  const blobToB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, "0")).join("");

  /* ---------- Indicateur de synchronisation ---------- */
  let badge;
  function setSync(state){
    if (!badge){ badge = document.createElement("div"); badge.id = "syncBadge"; badge.setAttribute("aria-live", "polite");
      badge.style.cssText = "position:fixed;left:max(12px, env(safe-area-inset-left, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:60;font:600 12px/1.2 system-ui,sans-serif;padding:7px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none";
      document.body.appendChild(badge); }
    const map = { saving: ["Enregistrement…", "#fbecd5", "#86470c"], offline: ["Hors connexion : les modifications ne sont pas enregistrées", "#f8e1dd", "#8a2a20"], error: ["Échec de l'enregistrement — réessayez", "#f8e1dd", "#8a2a20"] };
    const m = map[state]; if (!m){ badge.hidden = true; return; }
    badge.hidden = false; badge.textContent = m[0]; badge.style.background = m[1]; badge.style.color = m[2];
  }

  /* ---------- Données ---------- */
  const store = {}; COLS.forEach(c => store[c] = new Map());
  const files = {};
  let branch = null, head = null, ready = false, syncing = false, pending = 0;
  const listeners = [];
  function snapFor(l){
    let docs = [...store[l.col].entries()].map(([id, v]) => ({ id, exists: true, data: () => v.data, metadata: { fromCache: !ready, hasPendingWrites: v.sha === "pending" } }));
    if (l.sort){ const { f, dir } = l.sort; docs.sort((a, b) => (dir === "desc" ? -1 : 1) * String(a.data()[f] ?? "").localeCompare(String(b.data()[f] ?? ""))); }
    else docs.sort((a, b) => a.id.localeCompare(b.id));
    if (l.limit) docs = docs.slice(0, l.limit);
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: !ready, hasPendingWrites: false } };
  }
  const notify = col => { for (const l of listeners) if (l.col === col) { try { l.fn(snapFor(l)); } catch(e){ console.error(e); } } };
  const cacheKey = () => "cache:" + CFG.repo;
  function saveCache(){ const o = {}; for (const c of COLS) o[c] = [...store[c].entries()].map(([id, v]) => [id, v.data]); LS.set(cacheKey(), JSON.stringify(o)); }
  function loadCache(){ try { const o = JSON.parse(LS.get(cacheKey()) || "null"); if (!o) return; for (const c of COLS) store[c] = new Map((o[c] || []).map(([id, d]) => [id, { data: d, sha: null }])); } catch(e){} }

  async function fetchTree(){
    const ref = await gh(`/repos/${CFG.repo}/git/ref/heads/${branch}`);
    const commit = ref.object.sha; if (commit === head) return new Set();
    const tree = await gh(`/repos/${CFG.repo}/git/trees/${commit}?recursive=1`);
    const seen = new Set(), todo = [], changed = new Set();
    for (const e of tree.tree){
      if (e.type !== "blob") continue;
      files[e.path] = e.sha;
      const m = e.path.match(/^data\/([^/]+)\/([^/]+)\.json$/); if (!m || !COLS.includes(m[1])) continue;
      seen.add(m[1] + "/" + m[2]);
      const cur = store[m[1]].get(m[2]);
      if (!cur || (cur.sha !== e.sha && cur.sha !== "pending")) todo.push([m[1], m[2], e.sha]);
    }
    for (const c of COLS) for (const [id, v] of [...store[c].entries()]) if (!seen.has(c + "/" + id) && v.sha !== "pending"){ store[c].delete(id); changed.add(c); }
    for (let i = 0; i < todo.length; i += 6){
      await Promise.all(todo.slice(i, i + 6).map(async ([c, id, sha]) => {
        const b = await gh(`/repos/${CFG.repo}/git/blobs/${sha}`);
        try { store[c].set(id, { data: JSON.parse(b64dec(b.content)), sha }); changed.add(c); } catch(e){ console.warn("Fichier illisible", c, id); }
      }));
    }
    head = commit;
    return changed;
  }
  async function sync(){
    if (syncing || !branch || pending) return; syncing = true;
    try { const ch = await fetchTree(); const first = !ready; ready = true;
      for (const c of (first ? COLS : ch)) notify(c); if (ch.size || first) saveCache(); if (badge && /Hors/.test(badge.textContent)) setSync(null); }
    catch(e){ if (e.status === 401){ showSetup("La clé d'accès n'est plus valide (expirée ou révoquée). Demandez un nouveau lien."); } else setSync("offline"); }
    finally { syncing = false; }
  }

  let queue = Promise.resolve();
  const enqueue = fn => { const p = queue.then(fn, fn); queue = p.catch(() => {}); return p; };
  async function putFile(path, contentB64, message){
    for (let attempt = 0; attempt < 3; attempt++){
      const body = { message, content: contentB64, branch }; if (files[path]) body.sha = files[path];
      try { const r = await gh(`/repos/${CFG.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`, { method: "PUT", body: JSON.stringify(body) }); files[path] = r.content.sha; return r.content.sha; }
      catch(e){
        if ((e.status === 409 || e.status === 422) && attempt < 2){
          try { const cur = await gh(`/repos/${CFG.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${branch}`); files[path] = cur.sha; }
          catch(e2){ if (e2.status === 404) delete files[path]; else throw e; }
          continue;
        }
        throw e;
      }
    }
  }
  async function delFile(path, message){
    for (let attempt = 0; attempt < 3; attempt++){
      if (!files[path]){ try { const cur = await gh(`/repos/${CFG.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${branch}`); files[path] = cur.sha; } catch(e){ if (e.status === 404) return; throw e; } }
      try { await gh(`/repos/${CFG.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`, { method: "DELETE", body: JSON.stringify({ message, sha: files[path], branch }) }); delete files[path]; return; }
      catch(e){ if ((e.status === 409 || e.status === 422) && attempt < 2){ delete files[path]; continue; } if (e.status === 404){ delete files[path]; return; } throw e; }
    }
  }
  const asDbError = e => ({ code: (e.status === 401 || e.status === 403) ? "invalid_argument" : "unavailable", message: String(e.message || e) });
  async function write(col, id, data){
    const prev = store[col].get(id); store[col].set(id, { data, sha: "pending" }); notify(col); saveCache();
    pending++; setSync("saving");
    try { const sha = await enqueue(() => putFile(`data/${col}/${id}.json`, b64enc(JSON.stringify(data, null, 1) + "\n"), `Carnet : ${col}/${id}`));
      const cur = store[col].get(id); if (cur && cur.data === data) cur.sha = sha; }
    catch(e){ if (prev) store[col].set(id, prev); else store[col].delete(id); notify(col); saveCache(); setSync("error"); pending--; throw asDbError(e); }
    pending--; if (!pending) setSync(null);
  }
  async function remove(col, id){
    const prev = store[col].get(id); store[col].delete(id); notify(col); saveCache();
    pending++; setSync("saving");
    try { await enqueue(() => delFile(`data/${col}/${id}.json`, `Carnet : suppression ${col}/${id}`)); }
    catch(e){ if (prev) store[col].set(id, prev); notify(col); setSync("error"); pending--; throw asDbError(e); }
    pending--; if (!pending) setSync(null);
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  function merge(a, b){ for (const k in b){ const v = b[k]; if (v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], v); else a[k] = v; } return a; }
  const colOf = c => { if (!store[c]){ store[c] = new Map(); COLS.push(c); } return c; };
  function docRef(path){
    const [col, id] = path.split("/"); colOf(col);
    return { id, path,
      async get(){ const v = store[col].get(id); return { id, exists: !!v, data: () => v && v.data, metadata: {} }; },
      set: data => write(col, id, clone(data)),
      update(data){ const cur = store[col].get(id); if (!cur) return Promise.reject({ code: "invalid_argument", message: "Document absent" }); return write(col, id, merge(clone(cur.data), clone(data))); },
      delete: () => remove(col, id),
      onSnapshot(next){ const l = { col, fn: s => next(s.docs.find(d => d.id === id) || { id, exists: false, data: () => undefined, metadata: {} }) }; listeners.push(l); setTimeout(() => l.fn(snapFor({ col })), 0); return () => listeners.splice(listeners.indexOf(l), 1); },
    };
  }
  function collRef(col, sort, limit){
    colOf(col);
    return {
      path: col,
      orderBy: (f, dir) => collRef(col, { f, dir: dir || "asc" }, limit),
      limit: n => collRef(col, sort, n),
      where(){ return this; },
      async get(){ return snapFor({ col, sort, limit }); },
      onSnapshot(next){ const l = { col, fn: next, sort, limit }; listeners.push(l); setTimeout(() => { try { next(snapFor(l)); } catch(e){ console.error(e); } }, 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; },
      doc: id => docRef(col + "/" + (id || rand(10))),
      async add(data){ const ref = docRef(col + "/" + rand(10)); await ref.set(data); return ref; },
    };
  }
  const db = { doc: docRef, collection: c => collRef(c) };

  /* ---------- Photos ---------- */
  const blobs = {}, loading = {};
  const PIXEL = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  window.CARNET_BLOB = id => {
    if (blobs[id]) return blobs[id];
    if (!loading[id] && branch){
      loading[id] = gh(`/repos/${CFG.repo}/contents/photos/${encodeURIComponent(id)}.jpg?ref=${branch}`, { accept: "application/vnd.github.raw", raw: true })
        .then(r => r.blob()).then(b => { blobs[id] = URL.createObjectURL(b); document.querySelectorAll(`img[data-blob="${CSS.escape(id)}"]`).forEach(img => { img.src = blobs[id]; }); })
        .catch(() => { delete loading[id]; });
    }
    return PIXEL;
  };
  new MutationObserver(() => { document.querySelectorAll("img[data-blob]").forEach(img => { const id = img.getAttribute("data-blob"); if (blobs[id] && img.src !== blobs[id]) img.src = blobs[id]; else if (!blobs[id]) window.CARNET_BLOB(id); }); })
    .observe(document.documentElement, { childList: true, subtree: true });
  const assets = {
    async upload(blob){
      const id = rand(16); const b64 = await blobToB64(blob);
      pending++; setSync("saving");
      try { await enqueue(() => putFile(`photos/${id}.jpg`, b64, "Carnet : photo")); }
      catch(e){ pending--; setSync("error"); throw { code: e.status === 422 ? "too_large" : "upstream_error", message: String(e.message) }; }
      pending--; if (!pending) setSync(null);
      blobs[id] = URL.createObjectURL(blob);
      return { id, url: blobs[id], sizeBytes: blob.size, contentType: blob.type || "image/jpeg" };
    },
    async delete(id){ await enqueue(() => delFile(`photos/${id}.jpg`, "Carnet : suppression photo")); return { deleted: true }; },
    async list(){ return { assets: [], usage: {} }; },
  };

  /* ---------- Téléchargements ---------- */
  const downloads = { async save({ filename, data }){ const blob = data instanceof Blob ? data : new Blob([data], { type: /\.md$/.test(filename) ? "text/markdown" : "application/octet-stream" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return { status: "saved" }; } };

  /* ---------- Écran de connexion et partage ---------- */
  function overlay(html){
    let o = document.getElementById("standaloneOverlay");
    if (!o){ o = document.createElement("div"); o.id = "standaloneOverlay"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
      o.style.cssText = "position:fixed;inset:0;z-index:70;background:var(--bg,#f3f5ee);color:var(--ink,#1e2a1b);overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) 40px max(18px, env(safe-area-inset-left,0px));font-family:var(--f-body,system-ui)";
      document.body.appendChild(o); }
    o.innerHTML = `<div style="max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px">${html}</div>`; o.hidden = false; return o;
  }
  function parseLink(s){ try { const u = new URL(String(s).trim()); const p = new URLSearchParams(u.hash.slice(1)); return p.get("k") && p.get("r") ? { k: p.get("k"), r: p.get("r") } : null; } catch(e){ return null; } }
  function showSetup(msg){
    const o = overlay(`<h1 style="font-family:var(--f-display,system-ui);font-size:1.6rem;margin:0">Carnet <span style="color:var(--accent,#c9741f)">de repas</span></h1>
      ${msg ? `<p style="margin:0;padding:10px 12px;border-radius:10px;background:var(--warn-soft,#fbecd5);color:var(--warn,#a4600a);font-weight:600">${esc(msg)}</p>` : ""}
      <p style="margin:0;color:var(--muted,#5d6a58)">Pour ouvrir le carnet, collez ici le lien qu'on vous a envoyé.</p>
      <label for="sLink" style="font-weight:600;font-size:.85rem">Lien du carnet</label>
      <input id="sLink" type="url" inputmode="url" placeholder="https://…#r=…&k=…" style="padding:11px;border:1px solid var(--line,#d8ddcd);border-radius:10px;font:inherit;background:var(--surface,#fff);color:inherit">
      <details><summary style="cursor:pointer;color:var(--muted,#5d6a58);font-size:.9rem">Première installation (propriétaire du carnet)</summary>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
          <label for="sRepo" style="font-weight:600;font-size:.85rem">Dépôt des données (propriétaire/nom)</label>
          <input id="sRepo" placeholder="alexis/carnet-de-repas-donnees" style="padding:11px;border:1px solid var(--line,#d8ddcd);border-radius:10px;font:inherit;background:var(--surface,#fff);color:inherit">
          <label for="sTok" style="font-weight:600;font-size:.85rem">Clé d'accès GitHub (fine-grained token)</label>
          <input id="sTok" type="password" autocomplete="off" style="padding:11px;border:1px solid var(--line,#d8ddcd);border-radius:10px;font:inherit;background:var(--surface,#fff);color:inherit">
        </div></details>
      <button id="sGo" style="padding:13px;border:0;border-radius:10px;background:var(--accent,#c9741f);color:var(--on-accent,#fff);font:600 1rem system-ui;cursor:pointer">Ouvrir le carnet</button>
      <p id="sMsg" role="status" style="margin:0;min-height:1.2em;font-weight:600"></p>`);
    o.querySelector("#sGo").onclick = async () => {
      const lk = parseLink(o.querySelector("#sLink").value), repo = lk ? lk.r : o.querySelector("#sRepo").value.trim(), tok = lk ? lk.k : o.querySelector("#sTok").value.trim();
      const m = o.querySelector("#sMsg");
      if (!repo || !tok){ m.textContent = "Collez le lien reçu (ou renseignez le dépôt et la clé)."; return; }
      m.textContent = "Vérification…"; CFG.token = tok; CFG.repo = repo;
      try { const info = await gh(`/repos/${repo}`); if (!info.permissions || !info.permissions.push) m.textContent = "Connecté en lecture seule.";
        LS.set("gh_token", tok); LS.set("gh_repo", repo); location.hash = `r=${encodeURIComponent(repo)}&k=${encodeURIComponent(tok)}`; location.reload(); }
      catch(e){ m.textContent = e.status === 401 ? "Cette clé n'est pas valide." : e.status === 404 ? "Dépôt introuvable avec cette clé : vérifiez le nom et les droits de la clé." : "Connexion impossible. Vérifiez le réseau."; }
    };
  }
  function shareLink(){ return `${location.origin}${location.pathname}#r=${encodeURIComponent(CFG.repo)}&k=${encodeURIComponent(CFG.token)}`; }
  function showShare(){
    const link = shareLink();
    const o = overlay(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0;font-family:var(--f-display,system-ui)">Partager le carnet</h2><button id="shClose" style="border:1px solid var(--line,#d8ddcd);background:var(--surface,#fff);color:inherit;border-radius:999px;width:36px;height:36px;cursor:pointer" aria-label="Fermer">✕</button></div>
      <p style="margin:0">Envoyez ce lien (WhatsApp, SMS…). Un clic suffit pour ouvrir le carnet, sans compte ni mot de passe.</p>
      <textarea id="shLink" readonly rows="4" style="padding:10px;border:1px solid var(--line,#d8ddcd);border-radius:10px;font:13px/1.4 ui-monospace,monospace;background:var(--surface,#fff);color:inherit;word-break:break-all">${esc(link)}</textarea>
      <button id="shCopy" style="padding:12px;border:0;border-radius:10px;background:var(--accent,#c9741f);color:var(--on-accent,#fff);font:600 1rem system-ui;cursor:pointer">Copier le lien</button>
      <p id="shMsg" role="status" style="margin:0;min-height:1.2em;font-weight:600;color:var(--herb,#3d6a37)"></p>
      <p style="margin:0;color:var(--muted,#5d6a58);font-size:.88rem">Toute personne qui a ce lien peut lire et modifier le carnet : ne l'envoyez qu'aux personnes concernées.</p>
      <p style="margin:0;color:var(--muted,#5d6a58);font-size:.88rem">Sur téléphone, pour avoir une icône : ouvrez le lien, puis Partager › « Sur l'écran d'accueil » (iPhone) ou ⋮ › « Ajouter à l'écran d'accueil » (Android).</p>
      <button id="shOut" style="padding:10px;border:1px solid var(--line,#d8ddcd);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer">Déconnecter cet appareil</button>`);
    o.querySelector("#shClose").onclick = () => { o.hidden = true; };
    o.querySelector("#shCopy").onclick = async () => { try { await navigator.clipboard.writeText(link); o.querySelector("#shMsg").textContent = "Lien copié."; } catch(e){ const ta = o.querySelector("#shLink"); ta.focus(); ta.select(); o.querySelector("#shMsg").textContent = "Sélectionnez le lien et copiez-le."; } };
    o.querySelector("#shOut").onclick = () => { LS.del("gh_token"); LS.del("gh_repo"); LS.del(cacheKey()); location.hash = ""; location.reload(); };
  }

  /* ---------- Démarrage ---------- */
  if (!CFG.token || !CFG.repo){
    window.claude = { use: async () => null };
    document.addEventListener("DOMContentLoaded", () => showSetup(""));
    return;
  }
  if (!location.hash.includes("k=")) history.replaceState(null, "", `${location.pathname}${location.search}#r=${encodeURIComponent(CFG.repo)}&k=${encodeURIComponent(CFG.token)}`);
  loadCache();
  const init = (async () => {
    try { const info = await gh(`/repos/${CFG.repo}`); branch = info.default_branch || "main"; }
    catch(e){ if (e.status === 401 || e.status === 404){ showSetup(e.status === 401 ? "La clé d'accès n'est plus valide. Demandez un nouveau lien." : "Le carnet est introuvable avec ce lien."); } else setSync("offline"); return; }
    await sync();
    setInterval(() => { if (document.visibilityState === "visible") sync(); }, 20000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
    window.addEventListener("online", sync);
  })();
  window.CARNET_SYNC = sync;
  window.claude = { use: async name => name === "db" ? db : name === "assets" ? assets : name === "downloads" ? downloads : null };
  document.addEventListener("DOMContentLoaded", () => { const b = document.getElementById("shareApp"); if (b){ b.hidden = false; b.onclick = showShare; } });
})();

</script>
<style>
/* Layout : carnet de cuisine à onglets — une colonne lisible au téléphone ; fiches et formulaires en panneau qui monte du bas */
:root{
  --bg:#f3f5ee; --surface:#ffffff; --ink:#1e2a1b; --muted:#5d6a58; --line:#d8ddcd;
  --accent:#c9741f; --accent-soft:#f7e8d6; --accent-ink:#86470c; --herb:#3d6a37; --herb-soft:#e3eddc;

const CARNET = (() => {
  const STOP = new Set(["de","d","du","des","la","le","les","l","a","au","aux","en","et","ou","avec","sans","un","une","sinon","type","environ","quelques","bonne","belle","gros","grosse","moyen","moyenne","bio","egoutte","egouttee","egouttes","egouttees","rape","rapee","rapes","hache","hachee","hachees","emince","eminces","decoupe","coupe","coupes","sec","seche","seches","desosse","desosses","sans","peau","goutte","gout","facultatif","option","optionnel","pour","servir","decor"]);
  // "hache" est un mot d'aliment pour le bœuf haché : on le garde dans les alias mais on l'ignore dans le texte ? Non : on le retire de STOP ci-dessous.
  STOP.delete("hache"); STOP.delete("hachee"); STOP.delete("sec"); STOP.delete("seche"); STOP.delete("seches");
  const sameLen = s => [...s].map(ch => { const d = ch.normalize("NFD")[0]; return d; }).join("");
  const norm = s => sameLen(String(s || "").toLowerCase()).replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[’']/g, " ");
  const sing = t => (t.length > 3 && /[sx]$/.test(t)) ? t.slice(0, -1) : t;
  const tokens = s => norm(s).replace(/[^a-z0-9%]+/g, " ").split(" ").filter(t => t && !STOP.has(t) && t !== "%").map(sing);

  function index(foods){
    const list = [];
    for (const f of foods) for (const a of [f.n, ...(f.a || [])]) {
      const tk = tokens(a); if (tk.length) list.push({ f, tk, len: a.length });
    }
    return list;
  }
  function matchFood(text, idx){
    const tk = new Set(tokens(text)); let best = null;
    for (const e of idx) {
      if (!e.tk.every(t => tk.has(t))) continue;
      if (!best || e.tk.length > best.tk.length || (e.tk.length === best.tk.length && e.len > best.len)) best = e;
    }
    return best ? best.f : null;
  }

  const WORDNUM = { un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10, douze:12, demi:0.5, demie:0.5 };
  const FRAC = { "½":0.5, "¼":0.25, "¾":0.75, "⅓":1/3, "⅔":2/3 };
  const UNITS = [
    [/^(cuil+\w*\.?\s*(a\s*)?soupe|c\.?\s*(a\s*)?soupe|c\.?\s*a\.?\s*s\.?|c\.?\s*s\.?|tbsp)(?![a-z])/, "cs"],
    [/^(cuil+\w*\.?\s*(a\s*)?cafe|c\.?\s*(a\s*)?cafe|c\.?\s*a\.?\s*c\.?|c\.?\s*c\.?|tsp)(?![a-z])/, "cc"],
    [/^(kg|kilos?|kilogrammes?)(?![a-z])/, "kg"],
    [/^(mg)(?![a-z])/, "mg"],
    [/^(g|gr|grs|grammes?)(?![a-z])/, "g"],
    [/^(ml|millilitres?)(?![a-z])/, "ml"],
    [/^(cl|centilitres?)(?![a-z])/, "cl"],
    [/^(dl)(?![a-z])/, "dl"],
    [/^(l|litres?)(?![a-z' ])/, "l"], [/^(l|litres?)(?=\s)/, "l"],
    [/^(pincees?)(?![a-z])/, "pincee"],
    [/^(gousses?)(?![a-z])/, "gousse"],
    [/^(bottes?|bouquets?)(?![a-z])/, "botte"],
    [/^(boites?|conserves?)(?![a-z])/, "boite"],
    [/^(tranches?)(?![a-z])/, "tranche"],
    [/^(sachets?)(?![a-z])/, "sachet"],
    [/^(pots?)(?![a-z])/, "pot"],
    [/^(cubes?)(?![a-z])/, "cube"],
    [/^(morceaux?)(?![a-z])/, "morceau"],
    [/^(branches?|brins?|tiges?)(?![a-z])/, "branche"],
    [/^(poignees?)(?![a-z])/, "poignee"],
    [/^(feuilles?)(?![a-z])/, "feuille"],
    [/^(bocal|bocaux)(?![a-z])/, "bocal"],
    [/^(verres?|tasses?|bols?|mugs?)(?![a-z])/, "tasse"],
    [/^(pieces?)(?![a-z])/, "piece"],
    [/^(paquets?)(?![a-z])/, "paquet"],
  ];
  const ADJ = /^(petite?s?|grande?s?|grosse?s?|belle?s?|beaux?)\s+/;

  function readQty(s){
    const a = norm(s);
    let m = a.match(/^\s*(\d+)\s*([½¼¾⅓⅔])/);
    if (m) return { q: +m[1] + FRAC[m[2]], len: m[0].length };
    m = a.match(/^\s*(\d+(?:[.,]\d+)?)\s*\/\s*(\d+)/);
    if (m) return { q: parseFloat(m[1].replace(",", ".")) / +m[2], len: m[0].length };
    m = a.match(/^\s*(\d+(?:[.,]\d+)?)/);
    if (m) return { q: parseFloat(m[1].replace(",", ".")), len: m[0].length };

      const r = norm(rest).match(/^\s*(?:a|-|–|ou)\s*\d+(?:[.,]\d+)?/); if (r) rest = rest.slice(r[0].length);
      const sp = rest.match(/^\s*(?:x\s+)?/); rest = rest.slice(sp[0].length);
      let a = norm(rest); const vague = a.match(/^(peu|trait|filet|soupcon|pointe|noisette|zeste)\s+(de\s+|d\s+)?/); if (vague){ q = null; rest = rest.slice(vague[0].length); a = norm(rest); }
      const adj = a.match(ADJ); if (adj){ rest = rest.slice(adj[0].length); a = norm(rest); }
      for (const [re, u] of UNITS){ const m = a.match(re); if (m){ unit = u; rest = rest.slice(m[0].length); break; } }
    } else {
      const m = norm(rest).match(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|cl|l)(?![a-z])/);
      if (m){ q = parseFloat(m[1].replace(",", ".")); unit = m[2]; rest = rest.slice(0, m.index) + " " + rest.slice(m.index + m[0].length); }

  }

  function parseLine(line, idx){
    const texte = String(line || "").trim();
    if (!texte) return null;
    if (/^#/.test(texte)) return { texte, titre: true, libelle: texte.replace(/^#+\s*/, ""), alimentId: null, grammes: null };

    return { texte, libelle, alimentId: f ? f.id : null, grammes: f ? toGrams(q, unit, f) : null, q, unite: unit };
  }

  function toGrams(q, unit, f){
    if (q == null) return f.ign || f.c === "placard" ? 0 : null;
    const d = f.d || 1;
    const per = { g:1, kg:1000, mg:0.001, ml:d, cl:10*d, dl:100*d, l:1000*d, cs:f.cs || 15, cc:f.cc || 5, pincee:0.5,

      morceau:f.pc || 20, branche:2, poignee:30, feuille:0.5, bocal:200, tasse:200 }[unit];

  const GROUPES = [["viande","Viandes, poissons"],["frais","Frais & crèmerie"],["legume","Fruits & légumes"],["epicerie","Épicerie"]];
  const fr = n => String(n).replace(".", ",");

/* ---------- Mode cuisine ---------- */
const TIMER_RE = /(\d+(?:[.,]\d+)?)(?:\s*(?:à|-|–)\s*(\d+(?:[.,]\d+)?))?\s*(minutes?|min|heures?|h|secondes?|sec|s)(?![a-zà-ÿ])/gi;
function timersIn(txt){
  const out = [], seen = new Set(); let m; TIMER_RE.lastIndex = 0;
  while ((m = TIMER_RE.exec(txt))){
    const a = parseFloat(m[1].replace(",", ".")), b = m[2] ? parseFloat(m[2].replace(",", ".")) : null, u = m[3].toLowerCase();
    const mult = u[0] === "h" ? 3600 : u[0] === "s" ? 1 : 60, unit = u[0] === "h" ? "h" : u[0] === "s" ? "s" : "min";
    const sec = Math.round(a * mult); if (!sec || seen.has(sec)) continue; seen.add(sec);
    out.push({ sec, label: `${fr(a)}${b ? "–" + fr(b) : ""} ${unit}` });
  }
  return out;
}
function stepIngredients(r, txt){
  const st = new Set(CARNET.tokens(txt));
  const has = a => { const tk = CARNET.tokens(a); return tk.length && tk.every(x => st.has(x)); };
  return (r.ingredients || []).filter(i => { if (i.titre) return false; const f = i.alimentId && BYID[i.alimentId]; if (f && f.ign) return false;
    if (f && [f.n, ...(f.a || [])].some(has)) return true;
    const lt = CARNET.tokens(i.libelle || "").filter(x => x.length > 3); return lt.length > 0 && lt.every(x => st.has(x)); });
}
const mmss = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function beep(){
  try { const a = S.audio; if (a){ [0, .4, .8].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .32); }); } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(e){}
}
function tickTimers(){
  const now = Date.now(); let changed = false;
  for (const tm of S.timers) if (!tm.done && now >= tm.end){ tm.done = true; changed = true; beep(); }
  const box = $("#cookTimers"); if (box) box.innerHTML = timersHTML();
  if (!S.timers.length){ clearInterval(S.tick); S.tick = null; }
}
function timersHTML(){
  return S.timers.map((tm, n) => `<button class="tchip${tm.done ? " done" : ""}" data-tchip="${n}" aria-label="${tm.done ? "Minuteur terminé, toucher pour fermer" : "Minuteur en cours, toucher pour l'arrêter"}">${tm.done ? "✓ Étape " + tm.step + " : c'est l'heure" : "⏱ " + mmss((tm.end - Date.now()) / 1000) + " · étape " + tm.step}</button>`).join("");
}

function photoBlock(key, id, label){

function renderCook(){
  const r = S.cook && S.recettes[S.cook.id]; if (!r){ closeCook(); return; }
  const steps = r.etapes || [], n = steps.length, i = Math.min(S.cook.i, n + 1); S.cook.i = i;
  const prog = Array.from({ length: n + 2 }, (_, k) => `<span class="${k <= i ? "on" : ""}"></span>`).join("");
  let body = "";
  if (i === 0){
    const ings = (r.ingredients || []).map((ing, k) => ing.titre ? `<li class="grp">${esc(ing.texte.replace(/^#+\s*/, ""))}</li>` : `<li data-ck="${k}" class="${S.cook.ck[k] ? "on" : ""}"><span class="box">✓</span><span>${esc(ing.texte)}</span></li>`).join("");
    body = `<div class="stepno">Avant de commencer</div><h2 class="bigtitle">${esc(r.nom)}</h2>
      <p class="small" style="font-size:.95rem">${esc([r.temps, unites(r, r.portions || 0), n + " étapes"].filter(Boolean).join(" · "))}</p>
      ${safeUrl(r.video) ? `<div>${videoBtn(r, "Regarder la vidéo avant de commencer")}</div>` : ""}
      <div class="handy"><h3>Sortez tout ce qu'il faut — touchez pour cocher</h3><ul class="cklist">${ings}</ul></div>
      ${r.astuce ? `<div class="note"><b>À lire avant de commencer</b>${tipsHTML(r.astuce)}</div>` : ""}
      ${r.incertitudes ? `<div class="incert"><b>Points incertains</b>${tipsHTML(r.incertitudes)}</div>` : ""}`;
  } else if (i <= n){
    const txt = steps[i - 1], tms = timersIn(txt), handy = stepIngredients(r, txt);
    body = `<div class="stepno">Étape ${i} sur ${n}</div><p class="steptext">${esc(txt)}</p>
      ${tms.length ? `<div class="tbtns">${tms.map(tm => `<button class="tbtn" data-timer="${tm.sec}">⏱ Lancer ${esc(tm.label)}</button>`).join("")}</div>` : ""}
      ${handy.length ? `<div class="handy"><h3>Sous la main pour cette étape</h3><ul class="cklist">${handy.map(ing => `<li><span class="box" style="border-color:var(--accent)"></span><span>${esc(ing.texte)}</span></li>`).join("")}</ul></div>` : ""}
      ${photoBlock(String(i - 1), (r.photos || {})[String(i - 1)], `Photo de l'étape ${i}`) .replace("📷 Photo de l'étape", "📷 Ajouter une photo de l'étape")}`;
  } else {
    body = `<div class="stepno">Terminé</div><h2 class="bigtitle">C'est prêt. Bon appétit !</h2>
      ${photoBlock("plat", r.photo, "Photo du plat").replace("📷 Photo du plat", "📷 Ajouter une photo du plat")}
      ${r.lendemain ? `<div class="note"><b>Conservation &amp; boîte du lendemain</b>${tipsHTML(r.lendemain)}</div>` : ""}`;
  }
  const next = i === 0 ? "Commencer" : i === n ? "Terminer" : i === n + 1 ? "Fermer" : "Étape suivante";
  $("#cook").innerHTML = `<div class="cook-head"><div class="cook-top"><div class="cook-title">${esc(r.nom)}</div><button class="btn ghost small" id="cookQuit">Quitter</button></div>
      <div class="prog" aria-hidden="true">${prog}</div><div class="cook-timers" id="cookTimers" aria-live="polite">${timersHTML()}</div></div>
    <div class="cook-body" id="cookBody"><div class="cook-inner">${body}</div></div>
    <div class="cook-foot"><div><button class="btn ghost" id="cookPrev" ${i === 0 ? "disabled" : ""}>← Retour</button><button class="btn" id="cookNext">${next}${i > 0 && i < n ? " →" : ""}</button></div></div>`;
  $("#cookBody").scrollTop = 0;
}
function cookMove(d){ const r = S.recettes[S.cook.id], n = (r.etapes || []).length; const j = S.cook.i + d; if (j < 0) return; if (j > n + 1){ closeCook(); return; } S.cook.i = j; renderCook(); }
async function shrink(file){
  try { const bmp = await createImageBitmap(file); const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85)); }
  catch(e){ return file; }
}
async function savePhoto(id, key, assetId){
  const r = S.recettes[id]; const doc = Object.fromEntries(Object.entries(r).filter(([k]) => k !== "id")); let old;
  if (key === "plat"){ old = doc.photo; if (assetId) doc.photo = assetId; else delete doc.photo; }
  else { const p = { ...(doc.photos || {}) }; old = p[key]; if (assetId) p[key] = assetId; else delete p[key]; doc.photos = p; }
  await S.db.doc("recettes/" + id).set(doc);
  return old;
}

/* ---------- Export ---------- */
function exportMarkdown(){
  const out = ["# Carnet de repas — recettes", ""];
  for (const [tk, tl] of TYPES) for (const [k, l] of CATS){ const rs = sortedRecipes().filter(r => typeOf(r) === tk && catOf(r) === k); if (!rs.length) continue; out.push(`## ${tl} — ${l}`, "");
    for (const r of rs){ out.push(`### ${r.nom}`, "");
      if (r.titreOriginal) out.push(`Titre original : ${r.titreOriginal}`, "");
      if (safeUrl(r.video)) out.push(`Vidéo : ${r.video}`, "");
      const meta = [r.cuisine, r.temps, unites(r, r.portions)].filter(Boolean).join(" · "); if (meta) out.push(`*${meta}*`, "");
      if (r.macros) out.push(`Calcul du carnet, par ${unite(r)} : ${r.macros.kcal} kcal · ${r.macros.proteines} g protéines · ${r.macros.glucides} g glucides · ${r.macros.lipides} g lipides · ${r.macros.fibres} g fibres${r.macros.manquants ? " (calcul partiel)" : ""}`, "");
      if (r.macrosAuteur) out.push(`Annoncé par l'auteur, non vérifié (${r.macrosAuteur.base || "par portion"}) : ${r.macrosAuteur.texte}${r.macrosAuteur.note ? " — " + r.macrosAuteur.note : ""}`, "");
      out.push("**Ingrédients**", ...(r.ingredients||[]).map(i => i.titre ? `\n*${i.texte.replace(/^#+\s*/, "")}*` : `- ${i.texte}`), "");
      if (r.incertitudes) out.push("**Points incertains**", ...lines(r.incertitudes).map(x => `- ${x}`), "");
      if ((r.etapes||[]).length) out.push("**Préparation**", ...r.etapes.map((s, n) => `${n+1}. ${s}`), "");
      if (r.astuce) out.push("**Le petit plus**", ...lines(r.astuce).map(x => `- ${x}`), ""); if (r.lendemain) out.push("**Conservation & boîte du lendemain**", ...lines(r.lendemain).map(x => `- ${x}`), ""); if (r.source) out.push(`Source : ${r.source}`, ""); } }
  return out.join("\n");
}

/* ---------- Événements ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const tab = t.closest("nav button"); if (tab){ S.view = tab.dataset.v; S.swap = null; ls.set("view", S.view); render(); return; }
  if (t.id === "sheet" && S.sheet === "form") return;
  if (t.id === "sheet" || t.closest("#closeSheet") || t.id === "cancelForm"){ if (S.sheet === "form" && S.form?.id) { const id = S.form.id; S.form = null; showRecipe(id); } else closeSheet(); return; }
  // Mode cuisine
  if (S.cook){
    if (t.id === "cookQuit"){ closeCook(); return; }
    if (t.id === "cookNext"){ cookMove(1); return; }
    if (t.id === "cookPrev"){ cookMove(-1); return; }
    const ck = t.closest("[data-ck]"); if (ck){ S.cook.ck[ck.dataset.ck] = !S.cook.ck[ck.dataset.ck]; ck.classList.toggle("on"); return; }
    const tb = t.closest("[data-timer]"); if (tb){ try { S.audio && S.audio.resume && S.audio.resume(); } catch(_){}
      S.timers.push({ end: Date.now() + (+tb.dataset.timer) * 1000, step: S.cook.i, done: false }); if (!S.tick) S.tick = setInterval(tickTimers, 1000); tickTimers(); return; }
    const tc = t.closest("[data-tchip]"); if (tc){ S.timers.splice(+tc.dataset.tchip, 1); tickTimers(); return; }
    const ph = t.closest("[data-photo]"); if (ph){ const fi = $("#cookFile"); fi.dataset.key = ph.dataset.photo; fi.value = ""; fi.click(); return; }
    const rp = t.closest("[data-rmphoto]");
    if (rp){ const st = $("#pstatus"); try { const old = await savePhoto(S.cook.id, rp.dataset.rmphoto, null); if (old && S.assets) { try { await S.assets.delete(old); } catch(_){} } renderCook(); }
      catch(err){ if (st){ st.className = "status err"; st.textContent = "La photo n'a pas pu être retirée."; } } return; }
    return;
  }
  const lc = t.closest("[data-cook]"); if (lc){ openCook(lc.dataset.cook); return; }
  // Semaine
  const sl = t.closest("[data-slot]");
  if (sl){ const [d, key] = sl.dataset.slot.split(":"); const day = +d;
    if (!S.canWrite || !S.db) return;
    if (S.swap){ const j = cloneJours(); const a = j[S.swap.day][S.swap.key], b = j[day][key]; j[S.swap.day][S.swap.key] = b; j[day][key] = a; const msg = `${j[S.swap.day].label} et ${j[day].label} échangés.`; S.swap = null; render(); await writeWeek(j, msg); return; }
    S.picker = null; showPicker(day, key, "", "toutes", "main"); return; }
  const ax = t.closest("[data-addx]");
  if (ax){ const [d, key] = ax.dataset.addx.split(":"); S.picker = null; showPicker(+d, key, "", "toutes", "add"); return; }
  const rx = t.closest("[data-rmextra]");
  if (rx){ const [d, key, n] = rx.dataset.rmextra.split(":"); const j = cloneJours(); const s = j[+d][key] || {}; const ex = (s.extras || []).slice(); const gone = S.recettes[ex[+n]]; ex.splice(+n, 1); j[+d][key] = { ...s, extras: ex };
    await writeWeek(j, `${gone ? gone.nom : "Élément"} retiré de ${j[+d].label}.`); return; }
  if (t.id === "cancelSwap"){ S.swap = null; render(); return; }
  const pq = t.closest("[data-pq]");
  if (pq){ const { day, key } = S.picker; const j = cloneJours(); const lab = j[day].label;
    if (pq.dataset.pq === "swap"){ S.swap = { day, key }; closeSheet(); S.view = "semaine"; render(); return; }
    if (pq.dataset.pq === "restes") j[day][key] = { type:"restes", recette:j[day-1].soir.recette, extras: j[day][key]?.extras || [] };
    if (pq.dataset.pq === "libre") j[day][key] = { type:"libre", texte:"Libre / dehors" };
    if (pq.dataset.pq === "vider") j[day][key] = { type:"libre", texte:"" };
    closeSheet(); await writeWeek(j, `${lab} mis à jour.`); return; }
  const pt = t.closest("[data-ptab]"); if (pt){ showPicker(S.picker.day, S.picker.key, S.picker.q, pt.dataset.ptab); return; }
  const py = t.closest("[data-ptype]"); if (py){ showPicker(S.picker.day, S.picker.key, S.picker.q, S.picker.tab, S.picker.mode, py.dataset.ptype); return; }
  const pk = t.closest("[data-pick]");
  if (pk){ const { day, key, mode } = S.picker; const j = cloneJours(); const old = j[day][key] || {}; const id = pk.dataset.pick;
    if (mode === "add") j[day][key] = { ...old, type: old.type || "libre", extras: [...(old.extras || []), id] };
    else j[day][key] = { type:"recette", recette:id, extras: old.extras || [] };
    closeSheet(); await writeWeek(j, `${j[day].label} : ${S.recettes[id].nom} ${mode === "add" ? "ajouté" : ""}`.trim() + "."); return; }
  if (t.id === "newWeek"){ await createWeek(); return; }
  // Recettes
  const op = t.closest("[data-open]"); if (op){ showRecipe(op.dataset.open); return; }
  const ch = t.closest("[data-filter]"); if (ch){ S.filter = ch.dataset.filter; render(); return; }
  if (t.id === "newRecipe"){ showForm(null, S.rtype); return; }
  const rt = t.closest("[data-rtype]"); if (rt){ S.rtype = rt.dataset.rtype; S.filter = "toutes"; render(); return; }
  const cb = t.closest("[data-cat]");
  if (cb && S.sheet?.startsWith("recipe:")){ const id = S.sheet.slice(7);
    try { await S.db.doc("recettes/" + id).update({ categorie: cb.dataset.cat }); const s = $("#rstatus"); if (s) s.textContent = `Rangée dans « ${catLabel(cb.dataset.cat)} ».`; } catch(err){ const s = $("#rstatus"); if (s){ s.className = "status err"; s.textContent = "Le changement n'a pas été enregistré."; } } return; }
  if (t.id === "editRecipe" && S.sheet?.startsWith("recipe:")){ showForm(S.sheet.slice(7)); return; }
  if (t.id === "delRecipe" && S.sheet?.startsWith("recipe:")){ showRecipe(S.sheet.slice(7), true); return; }
  if (t.id === "delNo" && S.sheet?.startsWith("recipe:")){ showRecipe(S.sheet.slice(7)); return; }
  if (t.id === "delYes" && S.sheet?.startsWith("recipe:")){ const id = S.sheet.slice(7), r = S.recettes[id], why = $("#delWhy").value.trim();
    t.disabled = true;
    try { if (why) await S.db.collection("suppressions").add({ nom:r.nom, raison:why, date:new Date().toISOString() });
      await S.db.doc("recettes/" + id).delete(); closeSheet(); S.view = "recettes"; render(); }
    catch(err){ t.disabled = false; const s = $("#rstatus"); if (s){ s.className = "status err"; s.textContent = "La suppression a échoué. Réessayez."; } } return; }
  if (t.id === "exportBtn"){ const s = $("#exportStatus");
    try { await S.dl.save({ filename:"carnet-de-repas-recettes.md", data:exportMarkdown() }); s.textContent = "Fichier enregistré."; }
    catch(err){ s.textContent = err?.code === "declined" ? "Export annulé." : "L'export n'est pas disponible ici."; } return; }
  // Formulaire
  const ft = t.closest("[data-ftype]"); if (ft){ document.querySelectorAll("#f-type button").forEach(b => b.setAttribute("aria-pressed", String(b === ft))); return; }
  const fc = t.closest("[data-fcat]"); if (fc){ document.querySelectorAll("#f-cat button").forEach(b => b.setAttribute("aria-pressed", String(b === fc))); return; }
  const fl = t.closest("[data-fixline]"); if (fl){ S.form.open = S.form.open === fl.dataset.fixline ? null : fl.dataset.fixline; S.form.foodQ = ""; refreshParsed(); $("#fx-q")?.focus(); return; }
  const pf = t.closest("[data-pickfood]");
  if (pf && S.form?.open){ const line = S.form.open, g = $("#fx-g").value; const f = BYID[pf.dataset.pickfood];
    let grams = g; if (g === "") { const p = CARNET.parseLine(line, IDX); grams = p ? CARNET.toGrams(p.q, p.unite, f) ?? "" : ""; }
    setOverride(line, f.id, grams); refreshParsed(); return; }
  if (t.id === "fx-ok" && S.form?.open){ const line = S.form.open, cur = formIngredients().find(i => i.texte === line); setOverride(line, cur?.alimentId || null, $("#fx-g").value); S.form.open = null; refreshParsed(); return; }
  if (t.id === "fx-auto" && S.form?.open){ delete S.form.ov[S.form.open]; S.form.open = null; refreshParsed(); return; }
  if (t.id === "nf-save" && S.form?.open){
    const n = $("#nf-n").value.trim(), num = id => Math.max(0, parseFloat(($(id).value || "0").replace(",", ".")) || 0);
    if (!n){ $("#nf-n").focus(); return; }
    const id = "perso-" + n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").slice(0, 30) + "-" + Math.random().toString(36).slice(2, 5);
    const food = { n, a:[n], v:[num("#nf-k"), num("#nf-p"), num("#nf-g"), num("#nf-l"), num("#nf-f")], c:"epicerie", perso:true };
    const pc = num("#nf-pc"); if (pc) food.pc = pc;
    try { await S.db.doc("aliments/" + id).set(food); S.customFoods = S.customFoods.concat([{ id, ...food }]); rebuildFoods();
      const line = S.form.open; const p = CARNET.parseLine(line, IDX); const gr = $("#fx-g").value !== "" ? $("#fx-g").value : (p ? CARNET.toGrams(p.q, p.unite, { id, ...food }) : null); setOverride(line, id, gr); S.form.open = null; refreshParsed(); }
    catch(err){ const s = $("#fstatus"); s.className = "status err"; s.textContent = "L'aliment n'a pas pu être créé."; } return; }
  // Courses
  const hv = t.closest("[data-have]"); if (hv){ const st = shopState(); st.have[hv.dataset.have] = !st.have[hv.dataset.have]; saveShop(st); hv.classList.toggle("have"); return; }
  const nd = t.closest("[data-need]"); if (nd){ const st = shopState(); st.need[nd.dataset.need] = !st.need[nd.dataset.need]; saveShop(st); nd.classList.toggle("need"); return; }
  if (t.id === "resetShop"){ saveShop({}); render(); return; }
  if (t.id === "copyBring"){ const txt = copyText();
    try { await navigator.clipboard.writeText(txt); $("#copied").textContent = "Liste copiée."; }
    catch(err){ $("#fb").hidden = false; const ta = $("#fbText"); ta.value = txt; ta.focus(); ta.select(); } return; }
  if (t.id === "saveExtras"){ const extras = $("#extrasTa").value.split("\n").map(s => s.trim()).filter(Boolean);
    try { await S.db.doc("semaines/" + week().id).update({ extras }); } catch(err){ const s = $("#xstatus"); if (s){ s.className = "status err"; s.textContent = "Non enregistré. Réessayez."; } } return; }
});
document.addEventListener("submit", e => { if (e.target.id === "rform"){ e.preventDefault(); saveForm(); } });
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "rsearch"){ S.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#rsearch"); el.focus(); try{ el.setSelectionRange(pos, pos); }catch(_){} return; }
  if (id === "pick-q"){ const pos = e.target.selectionStart; showPicker(S.picker.day, S.picker.key, e.target.value, S.picker.tab, S.picker.mode, S.picker.ptype); const el = $("#pick-q"); el.focus(); try{ el.setSelectionRange(pos, pos); }catch(_){} return; }
  if ((id === "f-ing" || id === "f-portions") && S.form){ clearTimeout(S.form.tmr); S.form.tmr = setTimeout(refreshParsed, 250); return; }
  if (id === "fx-q" && S.form){ S.form.foodQ = e.target.value; const pos = e.target.selectionStart; refreshParsed(); const el = $("#fx-q"); el.focus(); try{ el.setSelectionRange(pos, pos); }catch(_){} return; }
});
document.addEventListener("change", async e => {
  if (e.target.id === "cookFile" && S.cook){ const file = e.target.files && e.target.files[0]; if (!file) return; const key = e.target.dataset.key, id = S.cook.id; const st = $("#pstatus");
    if (st){ st.className = "status"; st.textContent = "Envoi de la photo…"; }
    try { const blob = await shrink(file); const up = await S.assets.upload(blob, { type: blob.type && /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : "image/jpeg" });
      const old = await savePhoto(id, key, up.id); if (old) { try { await S.assets.delete(old); } catch(_){} } if (S.cook) renderCook(); }
    catch(err){ const s = $("#pstatus"); if (s){ s.className = "status err"; s.textContent = err?.code === "too_large" ? "Photo trop lourde." : err?.code === "unsupported_type" ? "Format non pris en charge : utilisez une photo JPEG ou PNG." : err?.code === "quota_or_state" ? "Plus de place pour les photos." : "La photo n'a pas pu être envoyée. Réessayez."; } }
    return; }
  if (e.target.id === "weekSel"){ S.weekId = e.target.value; S.swap = null; render(); } });
document.addEventListener("keydown", e => {
  if (S.cook){ if (e.key === "ArrowRight") cookMove(1); else if (e.key === "ArrowLeft") cookMove(-1); else if (e.key === "Escape") closeCook(); return; }
  if (e.key === "Escape"){ if (!$("#sheet").hidden) closeSheet(); else if (S.swap){ S.swap = null; render(); } } });

(() => { let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => { if (!S.cook || e.touches.length !== 1) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", e => { if (!S.cook || x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) cookMove(dx < 0 ? 1 : -1); }, { passive: true });
  document.addEventListener("visibilitychange", async () => { if (S.cook && document.visibilityState === "visible" && navigator.wakeLock){ try { S.wake = await navigator.wakeLock.request("screen"); } catch(e){} } });
})();
async function createWeek(){
  const last = S.semaines.map(w => w.jours?.[w.jours.length-1]?.date).filter(Boolean).sort().pop();
  const start = last ? parseDate(last) : new Date(); if (last) start.setDate(start.getDate() + 1);
  const jours = []; for (let i = 0; i < 7; i++){ const d = new Date(start); d.setDate(start.getDate() + i);
    jours.push({ date:isoDate(d), label:`${DOW[d.getDay()]} ${d.getDate()}`, midi:{type:"libre", texte:""}, soir:{type:"libre", texte:""} }); }
  const end = parseDate(jours[6].date);
  const titre = `Semaine du ${start.getDate()}${start.getMonth()!==end.getMonth()?" "+MOIS[start.getMonth()]:""} au ${end.getDate()} ${MOIS[end.getMonth()]}`;
  const prev = week();
  try { await S.db.doc("semaines/" + jours[0].date).set({ titre, debut:jours[0].date, jours, petitDej: prev?.petitDej || "", note:"", extras: prev?.extras || [] });
    S.weekId = jours[0].date; }
  catch(err){ const s = $("#wstatus"); if (s){ s.className = "status err"; s.textContent = "La semaine n'a pas pu être créée."; } }
}

/* ---------- Démarrage ---------- */
(function start(){
  const v = ls.get("view"); if (["semaine","recettes","courses"].includes(v)) S.view = v;
  if (!window.claude || !window.claude.use){ render(); return; }
  claude.use("downloads").then(dl => { S.dl = dl; if (S.view === "recettes") render(); });
  claude.use("assets").then(a => { S.assets = a; if (S.cook) renderCook(); });
  claude.use("db").then(db => {
    if (!db){ $("#main").innerHTML = `<div class="empty">Ouvrez ce carnet connecté à votre compte Claude pour voir la semaine et les recettes.</div>`; return; }
    S.db = db;
    const refreshSheet = () => { if (S.sheet?.startsWith("recipe:")){ const sc = $("#sheet .sheet")?.scrollTop || 0; const confirming = !!$("#delWhy"); if (!confirming){ showRecipe(S.sheet.slice(7)); const el = $("#sheet .sheet"); if (el) el.scrollTop = sc; } } };
    db.collection("aliments").onSnapshot(snap => { S.customFoods = snap.docs.map(d => ({ id:d.id, ...d.data() })); rebuildFoods(); if (S.form) refreshParsed(); }, () => {});
    db.collection("recettes").onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = { id:d.id, ...d.data() }; }); S.recettes = o;
      if (S.sheet !== "form" && S.sheet !== "picker") { render(); refreshSheet(); } else render();
      if (S.cook) renderCook();
    }, () => {});
    db.collection("semaines").orderBy("debut","desc").limit(30).onSnapshot(snap => {
      S.semaines = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (!S.weekId || !S.semaines.find(w => w.id === S.weekId)){ const today = isoDate(new Date());
        const cur = S.semaines.find(w => w.debut <= today && (w.jours?.[w.jours.length-1]?.date || w.debut) >= today);
        const next = [...S.semaines].filter(w => w.debut > today).sort((x,y) => x.debut.localeCompare(y.debut))[0];
        S.weekId = (cur || next || S.semaines[0])?.id || null; }
      render();
    }, () => {});
  });
})();
